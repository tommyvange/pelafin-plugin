<!DOCTYPE html>
<html>
<head>
    <title>Pelafin</title>
</head>
<body>
<div id="PelafinConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-checkbox">
    <div data-role="content">
        <div class="content-primary">
            <form id="PelafinConfigForm" style="max-width: 60em;">
                <div class="verticalSection">
                    <h2>Pelafin</h2>
                    <p>
                        This holds the configuration used by Pelafin (home screen layout, item page settings, branding, links, etc.), stored here as raw JSON. It is recommended to edit the configuation via Pelafin settings directly.
                    </p>
                </div>
                <div class="inputContainer">
                    <label class="inputLabel inputLabelUnfocused" for="ConfigJson">Config JSON</label>
                    <textarea
                        id="ConfigJson"
                        name="ConfigJson"
                        rows="24"
                        spellcheck="false"
                        style="width: 100%; font-family: monospace; font-size: 0.9em; white-space: pre; overflow-wrap: normal; overflow-x: auto;"
                    ></textarea>
                </div>
                <div id="ConfigJsonError" class="fieldDescription" style="color: #ff5252; display: none;"></div>
                <br />
                <div>
                    <button is="emby-button" type="submit" class="raised button-submit block">
                        <span>Save</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
    <img
        src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBTAA7"
        alt=""
        style="display:none"
        onload="(function(){var pluginId='7c3f2a91-5b84-4d26-9e57-a1f08c6b42d3';function prettyOrRaw(raw){try{return JSON.stringify(JSON.parse(raw),null,2);}catch(e){return raw;}}Dashboard.showLoadingMsg();ApiClient.getPluginConfiguration(pluginId).then(function(config){document.querySelector('#ConfigJson').value=prettyOrRaw(config.AppConfigJson||'{}');Dashboard.hideLoadingMsg();});document.querySelector('#PelafinConfigForm').addEventListener('submit',function(e){e.preventDefault();var raw=document.querySelector('#ConfigJson').value;var errorEl=document.querySelector('#ConfigJsonError');try{JSON.parse(raw);}catch(err){errorEl.textContent='Not valid JSON: '+err.message;errorEl.style.display='';return false;}errorEl.style.display='none';Dashboard.showLoadingMsg();ApiClient.getPluginConfiguration(pluginId).then(function(config){config.AppConfigJson=raw;ApiClient.updatePluginConfiguration(pluginId,config).then(Dashboard.processPluginConfigurationUpdateResult);});return false;});})();"
    />
</div>
</body>
</html>
